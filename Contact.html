<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="Contact.css" />
  </head>
  <body>
    <header>
      <nav id="nav-links" data-testid="test-navigations">
        <ul>
          <li>
            <a href="index.html" data-testid="test-nav-contact">Profile</a>
          </li>
          <li>
            <a href="About.html" data-testid="test-nav-contact">About</a>
          </li>
          <li>
            <a href="Contact.html" data-testid="test-nav-contact"
              >Contact Us</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Contact Us</h1>

      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" data-testid="test-contact-name" />
          <small id="error-name" data-testid="test-contact-error-name"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" data-testid="test-contact-email" />
          <small
            id="error-email"
            data-testid="test-contact-error-email"
          ></small>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" data-testid="test-contact-subject" />
          <small
            id="error-subject"
            data-testid="test-contact-error-subject"
          ></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" data-testid="test-contact-message"></textarea>
          <small
            id="error-message"
            data-testid="test-contact-error-message"
          ></small>
        </div>

        <button type="submit" data-testid="test-contact-submit">Send</button>
        <p
          id="success"
          data-testid="test-contact-success"
          style="display: none"
        >
        <i class="fa-solid fa-square-check"></i>
          Message sent successfully!
        </p>
      </form>
    </main>
    <script src="Contact.js"></script>
  </body>
</html>
